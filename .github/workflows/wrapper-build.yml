name: Wrapper original server
on:
  push:
    branches: ['codex/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: wrapper-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-publish:
    if: github.repository_owner == 'BullX92'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ti4_wrapper_test
          POSTGRES_USER: ti4_test
          POSTGRES_PASSWORD: integration-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ti4_test -d ti4_wrapper_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Original testbed and real PostgreSQL restart test
        env:
          TI4_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/ti4_wrapper_test
          TI4_TEST_POSTGRES_USER: ti4_test
          TI4_TEST_POSTGRES_PASSWORD: integration-only
        run: mvn -B -ntp -Dtest=TestBedPressTest,TestBedDataTest,PostgresRestartPersistenceTest,OfferedActionStoreTest,WebPlayerButtonPressTest,WebPlayerProcessingOutcomeTest,WebInteractionRepliesTest,WrapperInputValidationTest,ConfiguredDiscordRolesTest,WrapperMessageIndexTest test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bullx92/ti4-wrapper-original:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
